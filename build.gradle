buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '1.0'
group = 'com.seccad.fluxoven'
archivesBaseName = 'fluxoven'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: 'official', version: '1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { fluxoven { source sourceSets.main } }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { fluxoven { source sourceSets.main } }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

dependencies {
    // Standard Forge for 1.16.5
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.34'

    // FIXED: JEI updated to 7.8.0.1013 to solve the NoSuchMethodError (func_96300_b)
    compileOnly fg.deobf("mezz.jei:jei-1.16.5:7.8.0.1013:api")
    runtimeOnly fg.deobf("mezz.jei:jei-1.16.5:7.8.0.1013")

    // Local Hwyla Solution
    // Ensure the file in /libs is EXACTLY: Hwyla-1.10.11-B78_1.16.5.jar
    implementation fg.deobf(project.dependencies.create([
            group: "mcp.mobius.waila",
            name: "Hwyla",
            version: "1.10.11-B78_1.16.5",
            ext: "jar"
    ]))
}

jar {
    manifest {
        attributes([
                "Specification-Title": "fluxoven",
                "Specification-Vendor": "seccad",
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"seccad",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')